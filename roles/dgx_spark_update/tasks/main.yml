---
- name: Refresh APT package metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install needrestart to manage services affected by package upgrades
  ansible.builtin.apt:
    name: needrestart
    state: present
  environment:
    NEEDRESTART_MODE: "{{ 'a' if dgx_spark_update_restart_services else 'l' }}"
  when: dgx_spark_update_restart_services

- name: Upgrade installed APT packages
  ansible.builtin.apt:
    upgrade: "{{ dgx_spark_update_upgrade_type }}"
    autoremove: "{{ dgx_spark_update_autoremove }}"
    autoclean: true
  register: dgx_spark_update_apt
  environment:
    NEEDRESTART_MODE: "{{ 'a' if dgx_spark_update_restart_services else 'l' }}"

- name: Install fwupd when firmware updates are enabled
  ansible.builtin.apt:
    name: fwupd
    state: present
  environment:
    NEEDRESTART_MODE: "{{ 'a' if dgx_spark_update_restart_services else 'l' }}"
  when: dgx_spark_update_firmware

- name: Refresh firmware metadata
  ansible.builtin.command:
    argv: [fwupdmgr, refresh]
  register: dgx_spark_update_firmware_refresh
  changed_when: false
  failed_when: >-
    dgx_spark_update_firmware_refresh.rc != 0 and
    'Metadata is up to date' not in
    (dgx_spark_update_firmware_refresh.stdout | default('') ~ '\n' ~ dgx_spark_update_firmware_refresh.stderr | default(''))
  when: dgx_spark_update_firmware

- name: Check for firmware upgrades
  ansible.builtin.command:
    argv: [fwupdmgr, get-upgrades]
  register: dgx_spark_update_firmware_check
  changed_when: false
  failed_when: >-
    dgx_spark_update_firmware_check.rc != 0 and
    'No updates available' not in
    (dgx_spark_update_firmware_check.stdout | default('') ~ '\n' ~ dgx_spark_update_firmware_check.stderr | default(''))
  when: dgx_spark_update_firmware

- name: Show firmware upgrade inventory
  ansible.builtin.debug:
    msg: "{{ dgx_spark_update_firmware_check.stdout | default('') }}{{ dgx_spark_update_firmware_check.stderr | default('') }}"
  when: dgx_spark_update_firmware and (dgx_spark_update_firmware_check.stdout | default('') | length > 0 or dgx_spark_update_firmware_check.stderr | default('') | length > 0)

- name: Install available device firmware updates
  ansible.builtin.command:
    argv: [fwupdmgr, update, --assume-yes]
  register: dgx_spark_update_firmware_apply
  changed_when: "'No upgrades' not in (dgx_spark_update_firmware_apply.stdout | default(''))"
  when:
    - dgx_spark_update_firmware
    - "'No updates available' not in (dgx_spark_update_firmware_check.stdout | default('') ~ '\n' ~ dgx_spark_update_firmware_check.stderr | default(''))"

- name: Reboot after updates when explicitly requested
  ansible.builtin.reboot:
    msg: Rebooting after DGX Spark package and firmware updates
    reboot_timeout: 1800
  when: dgx_spark_update_reboot and (dgx_spark_update_apt.changed or (dgx_spark_update_firmware and dgx_spark_update_firmware_apply.changed))
