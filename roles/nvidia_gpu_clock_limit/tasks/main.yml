---
- name: Find nvidia-smi
  ansible.builtin.command:
    argv: [which, nvidia-smi]
  register: nvidia_gpu_clock_limit_nvidia_smi
  changed_when: false

- name: Install one-shot GPU clock limit service
  ansible.builtin.template:
    src: nvidia-gpu-clock-limit.service.j2
    dest: /etc/systemd/system/{{ nvidia_gpu_clock_limit_unit_name }}
    owner: root
    group: root
    mode: "0644"
  register: nvidia_gpu_clock_limit_service_file
  notify: Reload systemd manager

- name: Enable GPU clock limit service at boot
  ansible.builtin.systemd_service:
    name: "{{ nvidia_gpu_clock_limit_unit_name }}"
    enabled: true
    daemon_reload: true
  when: not nvidia_gpu_clock_limit_service_file.changed

- name: Start GPU clock limit service when its unit is unchanged
  ansible.builtin.systemd_service:
    name: "{{ nvidia_gpu_clock_limit_unit_name }}"
    state: started
  when: not nvidia_gpu_clock_limit_service_file.changed
